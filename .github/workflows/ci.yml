name: Rust CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          ubuntu-latest,
          macos-latest,
          windows-latest,
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check for linter warnings
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features --all-targets

  release:
    name: Release - ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            binary_name: log-sender-x86_64
            generate_release_notes: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary_name: log-sender-aarch64
            generate_release_notes: false
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install musl target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --verbose --release --bin log-sender --target ${{ matrix.target }}
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/log-sender ${{ matrix.binary_name }}
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.binary_name }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ matrix.generate_release_notes }}
